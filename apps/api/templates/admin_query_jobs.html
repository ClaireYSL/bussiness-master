{% extends "base.html" %}
{% block title %}管理后台{% endblock %}
{% block body %}
<main class="dashboard-shell dashboard-shell--admin">
  <section class="dashboard-main dashboard-main--admin">
    <article class="admin-hero">
      <div class="admin-hero__content">
        <p class="eyebrow">系统配置</p>
        <h1 class="admin-hero__title">管理后台</h1>
      </div>
      <div class="admin-hero__metrics">
        <section class="admin-metric-card admin-metric-card--status">
          <div class="admin-metric-card__head">
            <div class="admin-metric-card__status-line">
              <p class="admin-metric-card__label">模型连接</p>
              <span id="moonshot-settings-status" class="pill pill--neutral">检测中…</span>
            </div>
            <button type="button" class="secondary-btn" data-action="open-admin-settings-modal">配置</button>
          </div>
        </section>
      </div>
    </article>

    <article class="panel-card admin-records-card">
      <div class="admin-section-head admin-section-head--records">
        <div>
          <p class="eyebrow">全量查询记录</p>
          <h2 class="section-title">记录中心</h2>
        </div>
        <div class="admin-section-head__meta">
          <span class="pill pill--soft">共 <span id="admin-query-total">--</span> 次查询</span>
        </div>
      </div>
      <div id="admin-job-list" class="list-stack list-stack--admin"></div>
      <div id="admin-job-pagination" class="pagination-row pagination-row--admin"></div>
    </article>
  </section>
</main>

<div id="admin-settings-modal" class="admin-config-modal" hidden>
  <div class="admin-config-modal__backdrop" data-action="close-admin-settings-modal"></div>
  <div class="admin-config-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="admin-settings-title">
    <div class="admin-config-modal__header">
      <div>
        <p class="eyebrow">模型连接配置</p>
        <h2 id="admin-settings-title" class="section-title">Moonshot API</h2>
      </div>
      <button type="button" class="ghost-btn" data-action="close-admin-settings-modal">关闭</button>
    </div>
    <form id="moonshot-settings-form" class="stack-form admin-config-form">
      <label class="admin-field">
        <span class="admin-field__label-row">
          <span>MOONSHOT_API_KEY</span>
        </span>
        <input id="moonshot-api-key" name="api_key" type="password" placeholder="输入 Kimi / Moonshot API Key" />
      </label>
      <div class="button-row admin-config-actions">
        <button type="button" class="secondary-btn" id="test-moonshot-key-button">测试连接</button>
        <button type="submit" class="primary-btn">保存配置</button>
      </div>
      <p id="moonshot-settings-message" class="form-message"></p>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  window.BUSSINESS_PAGE = "admin";
</script>
{% endblock %}
