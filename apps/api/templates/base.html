<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body class="{% block body_class %}app-shell{% endblock %}">
    {% block body %}{% endblock %}
    <div id="detail-modal" class="detail-modal" hidden>
      <div class="detail-modal__backdrop" data-action="close-detail-modal"></div>
      <div class="detail-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="detail-modal-title">
        <div class="detail-modal__header">
          <div>
            <p id="detail-modal-kicker" class="eyebrow">详情</p>
            <h3 id="detail-modal-title" class="section-title">查询详情</h3>
            <p id="detail-modal-meta" class="muted"></p>
          </div>
          <button type="button" class="ghost-btn detail-modal__close-btn" data-action="close-detail-modal">关闭</button>
        </div>
        <div id="detail-modal-body" class="detail-modal__body"></div>
      </div>
    </div>
    <div id="knowledge-doc-modal" class="knowledge-doc-modal" hidden>
      <div class="knowledge-doc-modal__backdrop" data-action="close-knowledge-doc-modal"></div>
      <div class="knowledge-doc-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="knowledge-doc-modal-title">
        <div class="knowledge-doc-modal__header">
          <div>
            <p class="eyebrow">知识库原文</p>
            <h3 id="knowledge-doc-modal-title" class="section-title">查看全文</h3>
            <p id="knowledge-doc-modal-meta" class="muted"></p>
          </div>
          <button type="button" class="ghost-btn" data-action="close-knowledge-doc-modal">关闭</button>
        </div>
        <div class="knowledge-doc-modal__body">
          <section id="knowledge-doc-modal-chunk" class="knowledge-doc-modal__section" hidden>
            <h4>命中原文段落</h4>
            <div id="knowledge-doc-modal-chunk-text" class="knowledge-doc-modal__text knowledge-doc-modal__markdown"></div>
          </section>
          <section class="knowledge-doc-modal__section">
            <h4>完整文档内容</h4>
            <div id="knowledge-doc-modal-full-text" class="knowledge-doc-modal__text knowledge-doc-modal__markdown"></div>
          </section>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.1/dist/markdown-it.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.3.3/dist/purify.min.js"></script>
    <script src="/static/app.js"></script>
    {% block scripts %}{% endblock %}
  </body>
  </html>
