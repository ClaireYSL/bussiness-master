<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>探迹会话同步器</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <section class="card stack">
        <label class="field">
          <span>本地 API 地址</span>
          <input id="local-api-base" type="text" placeholder="http://127.0.0.1:8000" />
        </label>
        <div id="active-tab-info" class="hint-box"></div>
        <div class="button-row">
          <button id="sync-button" class="primary-btn" type="button">抓取并同步</button>
          <button id="open-console-button" class="ghost-btn" type="button">打开本地控制台</button>
        </div>
        <pre id="status-box" class="status-box">等待开始…</pre>
      </section>

      <section class="card">
        <p class="eyebrow">同步内容</p>
        <ul class="plain-list">
          <li>`sales.tungee.com` / `user.tungee.com` 可用 cookie</li>
          <li>当前真实请求里的 `x-tonxis-pid / x-tonxis-sid / x-tonxis-signature`</li>
          <li>当前浏览器 `User-Agent` 与来源页面 URL</li>
        </ul>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
